nd%20-%2020090809.jpg?width=1200", "fixedCredit": "Wikimedia Commons — Micha L. Rieser", "fixedPage": "https://commons.wikimedia.org/wiki/File:Therme_Vals_facade,_Vals,_Graubünden,_Switzerland_-_20090809.jpg"}, {"name": "Kolumba Museum", "style": "Minimalizm", "wiki": "Kolumba", "place": "Kolonia, Niemcy", "date": "2007", "architect": "Peter Zumthor", "clue": "Monolityczna, spokojna bryła i subtelny detal materiałowy."}, {"name": "James-Simon-Galerie", "style": "Minimalizm", "wiki": "James Simon Gallery", "place": "Berlin, Niemcy", "date": "2019", "architect": "David Chipperfield Architects", "clue": "Redukcja formy, rytm smukłych podpór i oszczędna paleta materiałów."}];
const ALL = ["Antyk", "Romanizm", "Gotyk", "Renesans", "Manieryzm", "Barok", "Klasycyzm", "Historyzm", "Secesja", "Art déco", "Modernizm", "Brutalizm", "Postmodernizm", "Dekonstruktywizm", "High-tech", "Minimalizm"];
const N = 15;
let game=[], i=0, score=0, streak=0, mistakes={};

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function distractors(correct){
 const near={
 "Antyk":["Klasycyzm","Renesans","Historyzm"],"Romanizm":["Gotyk","Antyk","Historyzm"],"Gotyk":["Romanizm","Historyzm","Renesans"],
 "Renesans":["Manieryzm","Klasycyzm","Barok"],"Manieryzm":["Renesans","Barok","Historyzm"],"Barok":["Manieryzm","Klasycyzm","Renesans"],
 "Klasycyzm":["Renesans","Historyzm","Antyk"],"Historyzm":["Gotyk","Klasycyzm","Renesans"],"Secesja":["Art déco","Historyzm","Postmodernizm"],
 "Art déco":["Secesja","Modernizm","Historyzm"],"Modernizm":["Minimalizm","High-tech","Art déco"],"Brutalizm":["Modernizm","Postmodernizm","Dekonstruktywizm"],
 "Postmodernizm":["Modernizm","Dekonstruktywizm","Historyzm"],"Dekonstruktywizm":["Postmodernizm","High-tech","Modernizm"],
 "High-tech":["Modernizm","Dekonstruktywizm","Minimalizm"],"Minimalizm":["Modernizm","High-tech","Brutalizm"]};
 return near[correct] || shuffle(ALL.filter(x=>x!==correct)).slice(0,3)
}
function updateStats(){document.getElementById("stats").textContent=`${Math.min(i+1,N)}/${N} · ${score} pkt · 🔥 ${streak}`}
async function commonsImage(fileName){
  const u="https://commons.wikimedia.org/w/api.php?action=query&titles="+encodeURIComponent("File:"+fileName)+"&prop=imageinfo&iiprop=url&iiurlwidth=1200&format=json&origin=*";
  try{
    const r=await fetch(u), j=await r.json(), p=Object.values(j.query.pages)[0];
    const ii=p && p.imageinfo && p.imageinfo[0];
    if(ii) return {src:ii.thumburl||ii.url, page:"https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(fileName.replace(/ /g,"_"))};
  }catch(e){}
  return null;
}

async function wikiImage(q){
 const langs=["en","pl"];
 for(const lang of langs){
  try{
   const u=`https://${lang}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=1&prop=pageimages|info&inprop=url&piprop=thumbnail|name&pithumbsize=1200&format=json&origin=*`;
   const r=await fetch(u); const j=await r.json(); const p=j.query&&Object.values(j.query.pages)[0];
   if(p&&p.thumbnail) return {src:p.thumbnail.source,page:p.fullurl||"",title:p.title||q};
  }catch(e){}
 }
 return null
}
async function render(){
 if(i>=N){end();return}
 const x=game[i]; updateStats();
 const opts=shuffle([x.style,...distractors(x.style)]);
 document.getElementById("main").innerHTML=`<div class="wrap">
 <div class="photo" id="photo"><div class="loading">Ładowanie zdjęcia…</div></div>
 <div class="credit" id="credit"></div>
 <h1>W jakim stylu jest ten budynek?</h1>
 <div class="answers">${opts.map(o=>`<button class="ans" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>
 <section class="panel" id="panel"></section></div>`;
 document.querySelectorAll(".ans").forEach(b=>b.onclick=()=>answer(b,x));
 const ph=document.getElementById("photo");
 if(x.commonsFile){
   const im=await commonsImage(x.commonsFile);
   if(im){
     ph.style.backgroundImage=`url("${im.src}")`; ph.innerHTML="";
     document.getElementById("credit").innerHTML=`Zdjęcie: <a target="_blank" rel="noopener" href="${im.page}">Wikimedia Commons</a> · przypisane na stałe`;
   } else {
     ph.innerHTML='<div class="loading">Nie udało się pobrać przypisanego zdjęcia.</div>';
   }
 } else if(x.fixedImage){
   ph.style.backgroundImage=`url("${x.fixedImage}")`; ph.innerHTML="";
   document.getElementById("credit").textContent=x.fixedCredit||"Zdjęcie przypisane ręcznie do tego obiektu";
 } else {
   const im=await wikiImage(x.wiki);
   if(im){ph.style.backgroundImage=`url("${im.src}")`;ph.innerHTML="";document.getElementById("credit").innerHTML=`Zdjęcie: <a target="_blank" rel="noopener" href="${im.page}">Wikipedia / Wikimedia</a> · szczegóły licencji na stronie źródłowej`;}
   else ph.innerHTML='<div class="loading">Nie udało się pobrać zdjęcia. Sprawdź połączenie z internetem.</div>';
 }
}
function answer(btn,x){
 document.querySelectorAll(".ans").forEach(b=>{b.disabled=true;if(b.dataset.v===x.style)b.classList.add("good")});
 const ok=btn.dataset.v===x.style;
 if(ok){score+=100;streak++}else{btn.classList.add("bad");streak=0;mistakes[x.style]=(mistakes[x.style]||0)+1}
 updateStats();
 const p=document.getElementById("panel");p.className="panel show";
 p.innerHTML=`<div class="verdict">${ok?"✓ Dobrze! +100 pkt":"✕ Nie tym razem"} — ${esc(x.style)}</div>
 <div class="meta"><b>${esc(x.name)}</b><br>📍 ${esc(x.place)} · 📅 ${esc(x.date)}<br>👤 ${esc(x.architect)}</div>
 <div class="clue"><b>Po czym rozpoznać?</b>${esc(x.clue)}</div>
 <button class="next">Następne pytanie →</button>`;
 p.querySelector(".next").onclick=()=>{i++;render()};
}
function end(){
 const pct=Math.round(score/(N*100)*100);
 const weak=Object.entries(mistakes).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]).join(", ");
 document.getElementById("stats").textContent="KONIEC";
 document.getElementById("main").innerHTML=`<div class="end"><div class="logo">ARCHISTYLE</div><div class="scorebig">${score/100}/${N}</div>
 <h2>${pct}% poprawnych</h2><p class="small">${weak?`Do powtórki: ${esc(weak)}`:"Bez błędów — świetna seria!"}</p>
 <button class="start" id="again">Zagraj ponownie</button></div>`;
 document.getElementById("again").onclick=start;
}
function start(){game=shuffle(DB).slice(0,N);i=0;score=0;streak=0;mistakes={};render()}
start();
</script></body></html>
